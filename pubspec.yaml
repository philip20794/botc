name: blood_on_the_clocktower
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: any
  shared_preferences: ^2.0.18
  provider: ^6.0.3
  auto_size_text: ^3.0.0
  collection: ^1.16.0
  universal_html: ^2.2.4
  pdfrx: ">=2.4.8 <2.5.0"
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/grim_logo.png
  adaptive_icon_background: assets/images/grim_logo.png
  adaptive_icon_foreground: assets/images/grim_logo.png

flutter_native_splash:
  color: "#c9f2f8"
  image: assets/images/grim_logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/grim_logo.png
    icon_background_color: "#c9f2f8"

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf
  assets:
    - assets/characters/de.json
    - assets/characters/en.json
    - assets/night_order/order.json
