buildscript {
    repositories {
        google() // Stelle sicher, dass google() hier hinzugefügt ist
        mavenCentral() // Dies ist optional, aber häufig verwendet
    }
    dependencies {
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
