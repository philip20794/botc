<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Blood on the Clocktower – digitale Spielleitung und Spielvorbereitung.">
  <meta name="theme-color" content="#100C16">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Blood on the Clocktower">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>Blood on the Clocktower</title>
  <style>
    #botc-install-options {
      position: fixed;
      inset: auto 0 max(16px, env(safe-area-inset-bottom)) 0;
      width: min(420px, calc(100% - 32px));
      max-width: none;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      box-sizing: border-box;
      margin: auto;
      padding: 22px 20px 18px;
      background: #21192f;
      color: #f0e6d2;
      border: 1px solid #d4af67;
      border-radius: 18px;
      box-shadow: 0 12px 40px #000a;
      font-family: system-ui, sans-serif;
    }
    #botc-install-options::backdrop {
      background: #100c16ac;
    }
    #botc-install-options header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    #botc-install-options header img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 12px;
    }
    #botc-install-options h2 {
      font-family: Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
      margin: 0;
    }
    #botc-install-options p {
      margin: 0 0 16px;
      line-height: 1.5;
      font-size: 14px;
      color: #b8aab9;
    }
    #botc-install-options .botc-install-choice {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #d4af67;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-top: 10px;
      padding: 12px;
    }
    #botc-install-pwa {
      color: #100c16;
      background: #d4af67;
    }
    #botc-install-apk {
      color: #f0e6d2;
      background: #4a3b5e;
    }
    #botc-install-options .botc-install-hint {
      margin: 12px 0 0;
      font-size: 12px;
    }
    #botc-install-later {
      display: block;
      margin: 12px auto 0;
      padding: 8px 12px;
      border: none;
      background: none;
      color: #b8aab9;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
  <script src="install-options.js" defer></script>
</head>
<body>
  <dialog id="botc-install-options" aria-labelledby="botc-install-title">
    <header>
      <img src="icons/Icon-192.png" alt="" width="56" height="56">
      <h2 id="botc-install-title">Blood on the Clocktower installieren</h2>
    </header>
    <p>Wie möchtest du die App auf deinem Android-Gerät verwenden?</p>
    <button id="botc-install-pwa" class="botc-install-choice" type="button">
      Als Web-App installieren
    </button>
    <a id="botc-install-apk" class="botc-install-choice"
       href="https://github.com/philip20794/botc/releases/download/android-latest/b-o-t-c.apk"
       target="_blank" rel="noopener noreferrer">
      Android-App (APK) herunterladen
    </a>
    <p class="botc-install-hint">
      Für die APK-Installation musst du den Download öffnen und die Installation auf Android bestätigen.
    </p>
    <button id="botc-install-later" type="button">Nicht jetzt</button>
  </dialog>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
