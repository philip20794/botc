name: Sync PWA icons with Android app icon

on:
  push:
    branches:
      - main
      - feature/player-layout-pwa-icons-android-install-20261016
    paths:
      - assets/images/app/app_icon.png
      - .github/scripts/sync_pwa_icons.py
      - .github/workflows/sync-pwa-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PWA images
        run: |
          python -m pip install pillow
          python .github/scripts/sync_pwa_icons.py

      - name: Commit synchronized icons
        run: |
          git add web/icons/Icon-192.png web/icons/Icon-512.png \
            web/icons/Icon-maskable-192.png web/icons/Icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync PWA install icons with Android launcher icon"
            git push
          fi
