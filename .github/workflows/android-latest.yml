name: Deploy Android APK and Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Dart and widget tests
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install statistics worker for emulator integration tests
        run: npm install --prefix scripts/statistics --no-package-lock --no-audit --no-fund

      - name: Test Firestore rules and incremental statistics worker
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project b-o-t-c "node test/firestore_rules_emulator_check.mjs && node --test scripts/statistics/*.test.mjs"

  android-e2e:
    uses: ./.github/workflows/android-e2e.yml

  build-and-publish:
    needs: [test, android-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/release.keystore
          EOF

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build signed APK
        run: |
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          flutter build apk --release \
            --build-name="1.0.${GITHUB_RUN_NUMBER}" \
            --build-number="$BUILD_NUMBER"

      - name: Publish current APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Android latest" --notes "Automatisch erzeugte aktuelle Android-APK."
          gh release delete-asset android-latest app-release.apk --yes >/dev/null 2>&1 || true
          cp build/app/outputs/flutter-apk/app-release.apk b-o-t-c.apk
          gh release upload android-latest b-o-t-c.apk --clobber

  deploy-web-hosting:
    name: Build Flutter Web and deploy Firebase Hosting
    # Web deployment and Android publication can run independently after
    # checks pass. A signing issue must not prevent updating the web app.
    needs: [test, android-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build production Web/PWA
        run: flutter build web --release

      - name: Require Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B_O_T_C }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Configure repository secret FIREBASE_SERVICE_ACCOUNT_B_O_T_C with Firebase Hosting deploy service-account JSON."
            exit 1
          fi

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B_O_T_C }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Web/PWA to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project b-o-t-c --non-interactive

      - name: Production URL
        run: echo "Web app published at https://b-o-t-c.web.app/" >> "$GITHUB_STEP_SUMMARY"

  deploy-firestore-rules:
    name: Deploy Firestore security rules
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B_O_T_C }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy checked Firestore rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project b-o-t-c --non-interactive
