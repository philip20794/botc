name: Flutter PR checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/flutter-pr-checks.yml'
      - '.github/workflows/android-latest.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run all Flutter tests
        run: flutter test
      - name: Verify Flutter Web production build
        run: flutter build web --release
      - name: Test web installation choices
        run: node --test test/web_install_options_test.mjs
