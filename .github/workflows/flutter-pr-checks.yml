name: Flutter PR checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/flutter-pr-checks.yml'
      - '.github/workflows/android-latest.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run all Flutter tests
        run: flutter test
      - name: Verify Flutter Web production build
        run: flutter build web --release
      - name: Test web installation choices
        run: node --test test/web_install_options_test.mjs


  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install statistics worker for emulator integration tests
        run: npm install --prefix scripts/statistics --no-package-lock --no-audit --no-fund

      - name: Test Firestore rules and incremental statistics worker
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project b-o-t-c "node test/firestore_rules_emulator_check.mjs && node --test scripts/statistics/*.test.mjs"
